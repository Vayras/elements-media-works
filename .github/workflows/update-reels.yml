name: Update Instagram Reels

on:
  schedule:
    - cron: "0 6 * * *" # daily 6am UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-reels:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Fetch latest reels
        id: fetch
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
        run: node scripts/fetch-instagram-reels.mjs

      - name: Rotate stored access token
        if: steps.fetch.outputs.refreshed_token != ''
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: gh secret set IG_ACCESS_TOKEN --body "${{ steps.fetch.outputs.refreshed_token }}"

      - name: Commit updated reels.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/data/reels.json
          if ! git diff --staged --quiet; then
            git commit -m "Update Instagram reels"
            git push
          fi
